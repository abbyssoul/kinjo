name: Build Launchpad PPA source packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        description: "Exact release commit to check out and package."
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Ubuntu series the PPA publishes to. Each needs rustc-1.91 / cargo-1.91 in
  # its archive (see packaging/ppa/debian/control).
  PPA_SERIES: jammy noble resolute

jobs:
  source:
    name: Build unsigned source packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      series: ${{ steps.build.outputs.series }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build the source packages
        id: build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # shellcheck disable=SC2086 # PPA_SERIES is a space-separated list
          scripts/release/build-ppa-source.sh "$VERSION" ppa $PPA_SERIES
          # shellcheck disable=SC2086
          echo "series=$(printf '%s\n' $PPA_SERIES | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

      # Not prefixed release-: the stage and publish jobs take every release-*
      # artifact as a GitHub release asset.
      - name: Upload the source packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ppa-source-${{ inputs.version }}
          path: ppa/
          if-no-files-found: error
          retention-days: 7

  # Launchpad reports a failed build only by email, after the upload is public,
  # so build every series and architecture here first, the way Launchpad will.
  test-build:
    name: Offline build on ${{ matrix.series }} ${{ matrix.arch }}
    needs: source
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.source.outputs.series) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download the source packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ppa-source-${{ inputs.version }}
          path: ppa

      - name: Build, install, and run in a clean offline container
        env:
          VERSION: ${{ inputs.version }}
          SERIES: ${{ matrix.series }}
        run: scripts/release/test-ppa-build.sh ppa "$VERSION" "$SERIES"
