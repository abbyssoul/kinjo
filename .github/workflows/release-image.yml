name: Build container images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        description: "Exact release commit to check out and package."
        required: true
        type: string

permissions:
  contents: read

# Each architecture builds natively: the image compiles Rust, which under QEMU
# takes several times longer. The staged archive is the image the publish job
# pushes after approval, so what was smoke-tested here is what users pull.
jobs:
  image:
    name: Container image on ${{ matrix.arch }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check candidate identity
        id: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/release/check-version.sh manifest "$VERSION"
          {
            echo "rust=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: kinjo:candidate
          build-args: RUST_VERSION=${{ steps.source.outputs.rust }}
          labels: |
            org.opencontainers.image.title=kinjo
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.created=${{ steps.source.outputs.created }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Smoke-test and save the image
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(docker image inspect kinjo:candidate --format '{{.Architecture}}')" = "$ARCH"
          docker run --rm kinjo:candidate --version | grep -F "$VERSION"
          # A binary built without the zeroconf feature rejects the backend by
          # naming the feature; one built with it reaches the domain check.
          if docker run --rm kinjo:candidate --backend zeroconf --domain corp > zeroconf.txt 2>&1; then
            echo "::error::zeroconf accepted a non-local domain"
            exit 1
          fi
          grep -F "can only browse the default \`local\` domain" zeroconf.txt
          docker run --rm --entrypoint ls kinjo:candidate /etc/kinjo/commands | grep -Fx ssh.toml
          docker save kinjo:candidate -o "kinjo-${VERSION}-image-${ARCH}.tar"

      # Named image-*, not release-*: the archive is pushed to GHCR, never
      # attached to the GitHub release, so the release artifact set excludes it.
      - name: Upload staged image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-${{ matrix.arch }}-${{ inputs.version }}
          path: kinjo-${{ inputs.version }}-image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7
