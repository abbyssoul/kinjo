name: Build Linux release archives

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        description: "Exact release commit to check out and package."
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Static musl executables, so one archive runs on any Linux distribution and
# glibc version: Homebrew installs them on Linux without a Rust toolchain. The
# default features are pure Rust and need no C toolchain; the optional zeroconf
# backend links the system Avahi library and is not part of these archives.
# The same binary is packed into the classic snap.
jobs:
  linux:
    name: Linux archive on ${{ matrix.arch }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            file-arch: x86-64
            snap-arch: amd64
          - arch: aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            file-arch: aarch64
            snap-arch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check candidate identity
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/release/check-version.sh manifest "$VERSION"

      - name: Add the musl target to the pinned toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build, run, and package the static target
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --locked --verbose --target "$TARGET"
          binary="target/${TARGET}/release/kinjo"
          "$binary" --version | grep -F "$VERSION"
          file "$binary" | grep -F "${{ matrix.file-arch }}"
          # A dynamically linked binary would tie the archive to the build
          # runner's libc, which is the dependency these archives exist to drop.
          # x86_64 musl links as static-pie; aarch64 musl as plain static,
          # which file(1) reports as "statically linked".
          file_info="$(file "$binary")"
          if ! grep -qE 'statically linked|static-pie linked' <<<"$file_info"; then
            echo "::error title=Release binary is not statically linked::${binary} must have no runtime libc dependency, but file(1) did not report it as static."
            {
              echo "Check:    the release binary must be statically linked, so the archive,"
              echo "          Homebrew formula and snap run on any Linux distro."
              echo "Expected: file(1) output containing 'statically linked' or 'static-pie linked'."
              echo "Got:      ${file_info}"
              if command -v ldd >/dev/null; then
                echo "ldd says:"
                ldd "$binary" 2>&1 | sed 's/^/          /' || true
              fi
              echo "Possible causes:"
              echo "  - A new or updated dependency links a system library (build script"
              echo "    using pkg-config, e.g. *-sys crates for openssl, dbus, avahi)."
              echo "    Check: cargo tree --target ${TARGET} -i <crate>"
              echo "  - RUSTFLAGS or .cargo/config.toml disables crt-static"
              echo "    (-C target-feature=-crt-static)."
              echo "  - The build used a non-musl target (TARGET=${TARGET})."
              echo "  - file(1) changed its wording for static binaries. If ldd above shows"
              echo "    'not a dynamic executable' / 'statically linked', the binary is fine"
              echo "    and this check's pattern needs updating."
              echo "Next step: find the newly linked library (ldd output above), then switch"
              echo "that dependency to a pure-Rust or vendored/static feature, or drop it."
            } >&2
            exit 1
          fi

          name="kinjo-${VERSION}-${TARGET}"
          mkdir -p "$name/commands"
          cp "$binary" "$name/"
          cp README.md LICENSE "$name/"
          cp actions/*.toml "$name/commands/"
          timestamp="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M.%S HEAD)"
          find "$name" -exec touch -h -t "$timestamp" {} +
          tar --sort=name --owner=0 --group=0 --numeric-owner -cf "${name}.tar" "$name"
          gzip -n "${name}.tar"
          tar -tzf "${name}.tar.gz" > archive-contents.txt
          grep -Fx "${name}/kinjo" archive-contents.txt
          grep -Fx "${name}/README.md" archive-contents.txt
          grep -Fx "${name}/LICENSE" archive-contents.txt
          grep -Eq "^${name}/commands/[^/]+\.toml$" archive-contents.txt
          mkdir smoke
          tar -xzf "${name}.tar.gz" -C smoke
          test -x "smoke/${name}/kinjo"
          "smoke/${name}/kinjo" --version | grep -F "$VERSION"

      # The snap wraps the same static binary, so it inherits its portability.
      # Installing it on the runner proves classic confinement keeps the user's
      # HOME (so ~/.config/kinjo is shared with other installs) and that the
      # default commands beside the binary are found.
      - name: Pack, install, and run the snap
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          SNAP_ARCH: ${{ matrix.snap-arch }}
        run: |
          sudo snap install snapcraft --classic
          scripts/release/pack-snap.sh "$VERSION" "$SNAP_ARCH" "target/${TARGET}/release/kinjo"
          sudo snap install --dangerous --classic "kinjo_${VERSION}_${SNAP_ARCH}.snap"
          /snap/bin/kinjo --version | grep -F "$VERSION"
          # $HOME must expand inside the snap's environment, not here.
          # shellcheck disable=SC2016
          test "$(snap run --shell kinjo -c 'printf %s "$HOME"')" = "$HOME"
          /snap/bin/kinjo list-commands | grep -E '^ssh[[:space:]]'
          sudo snap remove kinjo

      - name: Upload staged Linux archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-linux-${{ matrix.arch }}-${{ inputs.version }}
          path: |
            kinjo-${{ inputs.version }}-${{ matrix.target }}.tar.gz
            kinjo_${{ inputs.version }}_${{ matrix.snap-arch }}.snap
          if-no-files-found: error
          retention-days: 7
